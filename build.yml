name: Build YAVIS-Setup
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: pyinstaller --noconsole --noconfirm --name YAVIS --collect-all faster_whisper --collect-all ctranslate2 --collect-all pyttsx3 --collect-all sounddevice --hidden-import pyttsx3.drivers.sapi5 app.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: YAVIS-Setup
          path: installer/YAVIS-Setup.exe
